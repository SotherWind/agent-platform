metric: paid_order_count
version: 1
label: Paid order count
datasourceId: ecommerce_sqlite
status: certified
owner: retail-bi
factTable: orders
entityKey: id
measure:
  field: id
  aggregation: count
  additive: true
timeDimension: created_at
timezone: Asia/Shanghai
unit: count
defaultFilters:
  - field: status
    operator: "="
    value: paid
dimensions:
  - name: status
    table: orders
    column: status
  - name: city
    joinPath: order_user
    table: users
    column: city
synonyms:
  - paid order count
  - completed order count
  - 已支付订单数
joinGraph:
  - name: order_user
    from: orders
    to: users
    fromKey: user_id
    toKey: id
    cardinality: many_to_one
freshnessSlaHours: 24
requireTimeRange: false
